<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MBA Dilli Larai · GBV / Protection Case Management Specialist</title>
<link rel="icon" type="image/png" href="larai.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg1:#0a1424;--bg2:#0f2338;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.14);
  --glass-border-soft:rgba(255,255,255,0.08);
  --ink:#eaf3ff;--mute:#9db0c8;
  --teal:#2dd4bf;--teal2:#0f766e;--amber:#f59e0b;
  --shadow:rgba(0,0,0,.35);
  --blur:14px;
}
html[data-theme="light"]{
  --bg1:#eaf2fb;--bg2:#f7fbff;
  --glass:rgba(255,255,255,0.55);
  --glass-strong:rgba(255,255,255,0.75);
  --glass-border:rgba(255,255,255,0.85);
  --glass-border-soft:rgba(15,23,42,0.08);
  --ink:#0f172a;--mute:#5b6b83;
  --teal:#0d9488;--teal2:#0f766e;--amber:#d97706;
  --shadow:rgba(15,23,42,.12);
  --blur:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Manrope',system-ui,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(1100px 620px at 85% -10%,rgba(45,212,191,.28),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(245,158,11,.22),transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--ink);overflow:hidden;font-size:15px;
  transition:background .4s,color .3s;
  min-height:100dvh;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1100px 620px at 85% -10%,rgba(13,148,136,.20),transparent 60%),
    radial-gradient(900px 600px at -10% 110%,rgba(217,119,6,.16),transparent 60%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
}
.shell{
  position:relative;height:100dvh;display:grid;
  grid-template-rows:auto auto 1fr auto;
  max-width:1180px;margin:auto;padding:16px;gap:14px;z-index:1;
}

.top{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 18px;border-radius:20px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--blur)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(140%);
  box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
}
.top-actions{order:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.who{order:2;flex:1;min-width:200px;text-align:right}
.avatar{order:3}

.avatar{
  width:64px;height:64px;border-radius:18px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--amber));cursor:pointer;
  box-shadow:0 10px 30px rgba(45,212,191,.25);position:relative;padding:0;
  border:1px solid var(--glass-border);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar::after{content:"Tap to view";position:absolute;left:0;right:0;bottom:0;
  font-size:9px;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:2px 0;
  opacity:0;transition:.2s;font-weight:700}
.avatar:hover::after,.avatar:focus-visible::after{opacity:1}
.avatar:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.who h1{font-size:24px;font-weight:800;letter-spacing:.02em}
.who .hl{color:var(--teal);font-weight:600;font-size:13.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;
  background:var(--glass);border:1px solid var(--glass-border-soft);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:.2s;
}
a.chip:hover{border-color:var(--teal);color:var(--teal)}
.chip svg{width:14px;height:14px;color:var(--teal)}

.exports{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:7px;font:inherit;
  font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border-soft);
  color:var(--ink);cursor:pointer;transition:.2s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,rgba(45,212,191,.85),rgba(13,148,136,.85));
  border-color:rgba(45,212,191,.6);color:#042f2a;
  box-shadow:0 6px 18px rgba(45,212,191,.35)}
.btn.pri:hover{color:#042f2a;filter:brightness(1.08)}

.theme-toggle{
  width:44px;height:44px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glass-border-soft);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.2s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.theme-toggle:hover{border-color:var(--teal);color:var(--teal)}
.theme-toggle svg{width:20px;height:20px}
html[data-theme="light"] .theme-toggle .moon{display:block}
html[data-theme="light"] .theme-toggle .sun{display:none}
.theme-toggle .moon{display:none}
.theme-toggle .sun{display:block}

.tabs{display:flex;gap:6px;padding:4px 6px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;display:flex;align-items:center;gap:8px;font:inherit;
  font-size:13px;font-weight:700;color:var(--mute);
  background:var(--glass);border:1px solid var(--glass-border-soft);
  padding:8px 14px;border-radius:12px;cursor:pointer;transition:.2s;white-space:nowrap;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.tab small{font-size:10.5px;color:var(--mute);opacity:.7}
.tab:hover{color:var(--ink);border-color:var(--glass-border)}
.tab.on{
  color:#04211d;
  background:linear-gradient(135deg,rgba(45,212,191,.85),rgba(13,148,136,.85));
  border-color:rgba(45,212,191,.6);
  box-shadow:0 6px 18px rgba(45,212,191,.30);
}
.tab.on small{color:#04211d;opacity:.8}

.track{position:relative;overflow:hidden;min-height:0;border-radius:20px}
.slide{
  position:absolute;inset:0;overflow-y:auto;padding:18px 22px 26px;
  transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .4s ease;
  scrollbar-width:thin;scrollbar-color:var(--glass-border) transparent;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:20px;
  backdrop-filter:blur(var(--blur)) saturate(140%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(140%);
  box-shadow:0 10px 30px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
}
.slide[data-s=future]{transform:translateX(50px);opacity:0;pointer-events:none}
.slide[data-s=past]{transform:translateX(-50px);opacity:0;pointer-events:none}
.slide[data-s=active]{transform:none;opacity:1}
.inner{max-width:920px;margin:auto}
.kick{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.ttl{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:6px 0 4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:22px}

.panel{
  background:var(--glass-strong);
  border:1px solid var(--glass-border-soft);
  border-radius:18px;padding:18px 20px;margin-bottom:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.lead{font-size:15.5px;line-height:1.8;color:var(--ink);opacity:.92}
.lead b{color:var(--ink);opacity:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.kpi{
  background:var(--glass-strong);border-radius:16px;padding:16px 10px;text-align:center;
  border:1px solid var(--glass-border-soft);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--teal)}
.kpi span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 0 10px}

.tline{position:relative;padding-left:26px}
.tline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(var(--teal),rgba(255,255,255,0.08))}
.job{position:relative;margin-bottom:14px}
.job::before{content:"";position:absolute;left:-24px;top:22px;width:12px;height:12px;
  border-radius:50%;background:var(--bg1);border:2px solid var(--teal)}
.jh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.jh h3{font-size:17px;font-weight:800}
.when{
  font-size:12px;font-weight:700;color:#04211d;
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  padding:4px 11px;border-radius:999px;white-space:nowrap;
  box-shadow:0 4px 12px rgba(245,158,11,.30);
}
.org{color:var(--teal);font-weight:700;font-size:13.5px;margin:4px 0 10px}
ul.b{list-style:none}
ul.b li{position:relative;padding-left:18px;font-size:14px;line-height:1.7;color:var(--ink);opacity:.88;margin-bottom:4px}
ul.b li::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--amber)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grp h4{font-size:13px;font-weight:800;color:var(--teal);margin-bottom:12px;letter-spacing:.02em}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;
  background:var(--glass);border:1px solid var(--glass-border-soft);color:var(--ink);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}

.edu{
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  background:var(--glass-strong);border:1px solid var(--glass-border-soft);
  border-radius:18px;padding:16px 18px;margin-bottom:12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.edu .ic{width:46px;height:46px;border-radius:14px;background:rgba(45,212,191,.14);color:var(--teal);display:grid;place-items:center}
.edu .ic svg{width:22px;height:22px}
.edu h3{font-size:15.5px;font-weight:800}
.edu p{font-size:13.5px;color:var(--mute);margin-top:2px}

.ref{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--glass-strong);border:1px solid var(--glass-border-soft);
  border-radius:18px;padding:16px 18px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.ref .av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#06201c;background:linear-gradient(135deg,var(--amber),var(--teal))}
.ref h3{font-size:15.5px;font-weight:800}
.ref .r{font-size:13px;color:var(--mute);margin:2px 0 10px;line-height:1.5}
.ref a{display:block;font-size:13px;color:var(--ink);text-decoration:none;margin-top:4px;word-break:break-all}
.ref a:hover{color:var(--teal)}
.ref a svg{width:13px;height:13px;vertical-align:-2px;margin-right:6px;color:var(--teal)}

.big{display:grid;gap:12px}
.row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
  background:var(--glass-strong);border:1px solid var(--glass-border-soft);
  color:var(--ink);text-decoration:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.2s;
}
.row:hover{border-color:var(--teal)}
.row .ic{width:40px;height:40px;border-radius:12px;background:rgba(245,158,11,.14);color:var(--amber);display:grid;place-items:center;flex-shrink:0}
.row .ic svg{width:19px;height:19px}
.row small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.row span{font-size:15px;font-weight:700;word-break:break-word}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dcard{
  background:var(--glass-strong);border:1px solid var(--glass-border-soft);
  border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.dcard:hover{border-color:var(--teal)}
.dthumb{height:140px;background:rgba(255,255,255,.04);position:relative;display:grid;place-items:center;color:var(--amber);cursor:pointer;overflow:hidden}
.dthumb svg{width:38px;height:38px;position:relative;z-index:0}
.dthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.dbody{padding:12px 14px 6px;flex:1;min-width:0}
.dbody h3{font-size:14.5px;font-weight:800;word-break:break-word;line-height:1.3}
.dbody p{font-size:12px;color:var(--mute);margin-top:4px;word-break:break-word}
.dbody .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dbody .meta span{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border-soft);color:var(--mute)}
.dact{display:flex;gap:8px;padding:10px 14px 14px}
.dact button{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:inherit;font-size:12.5px;font-weight:700;padding:9px;border-radius:10px;
  background:var(--glass);border:1px solid var(--glass-border-soft);
  color:var(--ink);cursor:pointer;
}
.dact svg{width:14px;height:14px}
.dact .v{background:linear-gradient(135deg,rgba(45,212,191,.85),rgba(13,148,136,.85));border-color:rgba(45,212,191,.6);color:#042f2a}
.dempty{color:var(--mute);font-size:14px;padding:26px 18px;text-align:center;border:1px dashed var(--glass-border);border-radius:16px}

.vw{position:fixed;inset:0;background:rgba(3,10,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.vw.on{display:flex}
.vwin{
  background:var(--glass-strong);
  border:1px solid var(--glass-border);
  border-radius:18px;width:min(920px,100%);max-height:92dvh;
  display:flex;flex-direction:column;overflow:hidden;
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.vwh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-border-soft)}
.vwh h3{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vwh .x{background:var(--glass);border:1px solid var(--glass-border-soft);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;font:inherit;font-weight:700}
.vwb{flex:1;min-height:260px;display:grid;place-items:center;padding:14px;background:rgba(0,0,0,.10);overflow:auto}
.vwb img{max-width:100%;max-height:68dvh;border-radius:10px}
.vwb .nop{text-align:center;color:var(--mute);font-size:14px;line-height:1.6;max-width:460px}
.vwf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--glass-border-soft);flex-wrap:wrap}
.vwf .url{font-size:12px;color:var(--mute);word-break:break-all;flex:1;min-width:200px}

.foot{display:flex;align-items:center;gap:14px;padding:6px 6px 6px}
.nav{
  display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border-soft);
  color:var(--ink);cursor:pointer;flex-shrink:0;transition:.2s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.nav svg{width:18px;height:18px}
.nav:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.nav:disabled{opacity:.3;cursor:default}
.prog{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.bar{height:4px;background:var(--glass);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .5s;width:0}
.pl{font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;gap:10px}

.toast{
  position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;
  background:linear-gradient(135deg,rgba(45,212,191,.95),rgba(13,148,136,.95));
  color:#04211d;font-weight:800;font-size:13px;padding:10px 18px;border-radius:999px;
  transition:.35s;pointer-events:none;z-index:9;
  box-shadow:0 10px 30px rgba(45,212,191,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(min-width:900px){
  body{overflow:hidden}
  .shell{
    grid-template-columns:1fr 260px;
    grid-template-rows:auto 1fr;
    gap:14px 18px;padding:18px;height:100dvh;
  }
  .top{grid-column:1/-1;padding:12px 18px}
  .tabs{display:none}
  .side{
    display:block !important;
    grid-column:2;grid-row:2;
    overflow-y:auto;padding:10px 6px 10px 0;
    scrollbar-width:thin;border-radius:20px;
  }
  .side .tab{width:100%;justify-content:flex-start;margin-bottom:6px;padding:12px 16px;font-size:13.5px}
  .track{grid-column:1;grid-row:2;margin:0}
  .foot{display:none}
  .slide{padding:18px 22px 30px}
  .inner{max-width:100%}
  .ttl{font-size:34px}
  .sub{font-size:15px}
}
@media(min-width:900px) and (max-width:1100px){
  .shell{grid-template-columns:1fr 220px}
  .who h1{font-size:22px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  body{overflow:auto}
  .shell{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto}
  .track{height:72dvh;min-height:520px}
  .grid3,.kpis{grid-template-columns:1fr 1fr}
  .who{text-align:left}
  .chips{justify-content:flex-start}
  .top-actions{order:3;width:100%}
  .who{order:1;flex:1}
  .avatar{order:2}
  .who h1{font-size:22px}.ttl{font-size:25px}
  .side{display:none !important}
}
@media(max-width:560px){
  .grid3,.kpis{grid-template-columns:1fr}
  .exports{width:100%}
  .exports .btn{flex:1;justify-content:center}
  .top-actions{width:100%;display:flex;gap:8px;flex-wrap:wrap}
  .theme-toggle{width:44px;height:44px;flex:0 0 auto}
}
@media(prefers-reduced-motion:reduce){
  .slide{transition:none}
  .bar i{transition:none}
}
</style>
</head>
<body>
<div class="shell">
 <header class="top">
  <div class="top-actions">
   <button class="theme-toggle" id="themeBtn" aria-label="Toggle light and dark mode">
     <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
     <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
   </button>
   <div class="exports">
    <button class="btn pri" onclick="dlResume('pdf')" id="bp"></button>
    <button class="btn" onclick="dlResume('doc')" id="bd"></button>
    <button class="btn" onclick="dlResume('txt')" id="bt"></button>
   </div>
  </div>
  <div class="who">
   <h1 id="name"></h1>
   <div class="hl" id="headline"></div>
   <div class="chips" id="chips"></div>
  </div>
  <button class="avatar" id="avatarBtn" aria-label="View profile photo">
    <img id="avatarImg" src="larai.jpeg" alt="MBA Dilli Larai">
  </button>

function kindOf(u){const p=u.split(/[?#]/)[0].toLowerCase();if(/\.(jpe?g|png|gif|webp|bmp|svg)$/.test(p))return 'image';if(/\.pdf$/.test(p))return 'pdf';return 'link'}
function hostOf(u){
  if(/^data:/i.test(u))return 'embedded';
  if(/^https?:\/\//i.test(u)){try{return new URL(u).hostname}catch(e){return ''}}
  const parts=u.replace(/^\.?\//,'').split('/');
  return parts.length>1?parts.slice(0,-1).join('/'):'local file';
}
function isDocUrl(u){
  if(!u)return false;
  if(/^(https?:\/\/|data:image\/)/i.test(u))return true;
  return /\.(jpe?g|png|gif|webp|bmp|svg|pdf)$/i.test(u.split(/[?#]/)[0]);
}

const FN='Mba_Dilli_Larai_Resume';
async function getDL(){try{if(window.claude&&window.claude.use)return await window.claude.use('downloads')}catch(e){}return null}
function browserSave(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function saveOut(name,blob){
 const d=await getDL();
 if(d){try{const buf=new Uint8Array(await blob.arrayBuffer());await d.save({filename:name,data:buf});return}catch(e){if(e&&e.code==='declined')throw new Error('cancelled')}}
 browserSave(blob,name);
}
async function dlResume(f){
 const build={pdf:buildPdf,doc:buildDoc,txt:buildTxt}[f];
 try{
  const blob=await build();
  await saveOut(FN+'.'+(f==='doc'?'doc':f),blob);

 }catch(e){
  if(e&&e.message==='cancelled'){toast('Download cancelled');return}
  console.error(e);toast('Could not create the '+f.toUpperCase()+' file. Please try again.');
 }
}

function buildPdf(){

 const d=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
 const W=595.28,H=841.89,M=48,CW=W-2*M;
 const TL=[15,118,110],AM=[217,119,6],DK=[15,23,42],GR=[71,85,105],LINE=[226,232,240],MUTE=[100,116,139];
 let y=0;
 const need=h=>{if(y+h>H-64){d.addPage();y=M+6}};
 const F=(st,sz,c)=>{d.setFont('helvetica',st);d.setFontSize(sz);d.setTextColor(...c)};

 const sec=t=>{
   need(40);y+=14;
   F('bold',10.5,TL);d.text(A(t).toUpperCase(),M,y);
   d.setDrawColor(...LINE);d.setLineWidth(.6);
   d.line(M,y+7,W-M,y+7);
   y+=20;
 };

 const para=(s,sz=9.6,c=GR,lh=1.55)=>{
   F('normal',sz,c);
   d.splitTextToSize(A(s),CW).forEach(l=>{need(sz*lh);d.text(l,M,y);y+=sz*lh});
 };

 const bullet=s=>{
   F('normal',9.4,GR);
   d.splitTextToSize(A(s),CW-16).forEach((l,i)=>{
     need(13);
     if(!i){d.setFillColor(...AM);d.circle(M+3.5,y-3,1.6,'F')}
     d.text(l,M+16,y);y+=13;
   });
   y+=1.8;
 };

 const role=(t,dt,o)=>{
   need(46);
   F('bold',11,DK);d.text(A(t),M,y);
   F('normal',9,MUTE);d.text(A(dt),W-M,y,{align:'right'});
   y+=13;
   F('normal',9.5,TL);d.splitTextToSize(A(o),CW).forEach(l=>{d.text(l,M,y);y+=12.5});
   y+=3;
 };

 d.setFillColor(...TL);d.rect(0,0,W,116,'F');
 d.setFillColor(...AM);d.rect(0,116,W,3,'F');
 F('bold',24,[255,255,255]);d.text(R.name,M,50);
 F('normal',11.5,[207,250,244]);d.text(A(R.headline),M,72);
 F('normal',9.2,[255,255,255]);d.text(A(R.email+'   ·   '+R.phone),M,94);
 F('normal',9.2,[255,255,255]);d.text(A(R.addr),M,108);
 y=142;

 const bw=(CW-36)/4;
 R.stats.forEach((s,i)=>{
   const x=M+i*(bw+12);
   d.setFillColor(240,253,250);
   d.roundedRect(x,y,bw,50,8,8,'F');
   F('bold',18,TL);d.text(s[0],x+bw/2,y+24,{align:'center'});
   F('normal',7.6,MUTE);d.text(A(s[1]).toUpperCase(),x+bw/2,y+39,{align:'center'});
 });
 y+=66;

 sec('Professional Summary');
 para(R.objective,9.6);

 sec('Skills & Tools');
 R.skills.forEach(([cat,items])=>{
   F('bold',9.6,DK);d.text(A(cat),M,y);y+=12.5;
   F('normal',9.4,GR);
   d.splitTextToSize(A(items.join('  ·  ')),CW-10).forEach(l=>{need(13);d.text(l,M+10,y);y+=13});
   y+=5;
 });

 sec('Work Experience');
 R.exp.forEach((e,idx)=>{
   role(e.t,e.d,e.o);
   e.b.forEach(bullet);
   if(idx<R.exp.length-1){y+=8}
 });

 sec('Education');
 R.edu.forEach(e=>role(e.t,e.d,e.o));

 sec('Referees');
 R.refs.forEach(r=>{
   need(40);
   F('bold',10,DK);d.text(A(r.n),M,y);y+=12.5;
   F('normal',9,GR);d.text(A(r.r),M,y);y+=12;
   if(r.p||r.e){F('normal',9,TL);d.text(A([r.p,r.e].filter(Boolean).join('   ·   ')),M,y);y+=16}
   else y+=4;
 });

 sec('Languages');
 para(R.langs.join('  ·  '));

 if(DOCS.length){
   sec('Professional Training & Certifications');
   DOCS.forEach(x=>{
     need(42);
     F('bold',9.8,DK);d.text(A(x.title),M,y);
     const tag='Attached';
     F('bold',7.6,[4,47,42]);
     const tw=d.getTextWidth(tag)+14;
     const tx = W - M - tw;
     const ty = y - 8;
     d.setFillColor(...AM);
     d.roundedRect(tx, ty, tw, 13, 6, 6, 'F');
     d.text(tag, tx + tw/2, y + 1.5, {align:'center'});
     d.link(tx, ty, tw, 13, {url: RESUME_URL});
     y+=12;
     const meta=[x.year,x.org].filter(Boolean).join('   ·   ');
     if(meta){F('normal',9,GR);d.text(A(meta),M,y);y+=12}
     y+=4;
   });
 }

 const n=d.getNumberOfPages();
 for(let i=1;i<=n;i++){
   d.setPage(i);
   d.setDrawColor(...LINE);d.setLineWidth(.6);d.line(M,H-34,W-M,H-34);
   F('normal',8,MUTE);
   d.text(R.name+'  ·  Resume',M,H-20);
   d.text('Page '+i+' of '+n,W-M,H-20,{align:'right'});
 }
 d.setProperties({title:R.name+' - Resume',author:R.name,subject:A(R.headline)});
 return d.output('blob');
}

/* ================= WORD ================= */
function buildDoc(){
 const e=esc;
 const job=(t,dt,o)=>`<table width="100%" cellpadding="0" cellspacing="0" style="margin-top:9pt"><tr><td><h3>${e(t)}</h3></td><td class="dt" align="right">${e(dt)}</td></tr></table><p class="org">${e(o)}</p>`;
 const ul=a=>`<ul>${a.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`;
 const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${e(R.name)} - Resume</title>
<style>@page{size:A4;margin:1.7cm 1.8cm}body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#1e293b;line-height:1.35}
h1{font-size:24pt;color:#fff;margin:0;letter-spacing:1pt}h2{font-size:12pt;color:#0f766e;border-bottom:1.5pt solid #d97706;margin:15pt 0 5pt;text-transform:uppercase;padding-bottom:2pt}
h3{font-size:11pt;color:#0f172a;margin:0}p{margin:2pt 0}ul{margin:2pt 0 4pt 16pt;padding:0}li{margin:1.5pt 0}td{vertical-align:top}
.org{color:#0f766e;font-weight:bold;font-size:10pt}.dt{color:#64748b;font-size:9.5pt;white-space:nowrap}.sk td{padding:2pt 6pt 2pt 0;font-size:10pt}.st td{background:#ecfdf9;text-align:center;padding:6pt;border:3pt solid #fff}
.sn{font-size:16pt;font-weight:bold;color:#0f766e}.sl{font-size:7.5pt;color:#64748b;text-transform:uppercase}
a.doclink{color:#0f766e;text-decoration:none;font-weight:bold}</style></head><body>
<table width="100%" cellpadding="14" cellspacing="0"><tr><td bgcolor="#0f766e"><h1>${e(R.name)}</h1><p style="color:#ccfbf1;font-size:12pt">${e(R.headline)}</p><p style="color:#fff;font-size:9.5pt">${e(R.email)} &nbsp;|&nbsp; ${e(R.phone)}</p><p style="color:#fff;font-size:9.5pt">${e(R.addr)}</p></td></tr></table>
<table class="st" width="100%" cellspacing="0" style="margin-top:8pt"><tr>${R.stats.map(s=>`<td><span class="sn">${s[0]}</span><br><span class="sl">${e(s[1])}</span></td>`).join('')}</tr></table>
<h2>Professional Summary</h2><p>${e(R.objective)}</p>
<h2>Skills &amp; Tools</h2><table class="sk" width="100%">${R.skills.map(c=>`<tr><td width="30%"><b>${e(c[0])}</b></td><td>${e(c[1].join(', '))}</td></tr>`).join('')}</table>
<h2>Work Experience</h2>${R.exp.map(x=>job(x.t,x.d,x.o)+ul(x.b)).join('')}
<h2>Education</h2>${R.edu.map(x=>job(x.t,x.d,x.o)).join('')}
<h2>Referees</h2><table class="sk" width="100%">${R.refs.map(r=>`<tr><td width="34%"><b>${e(r.n)}</b></td><td>${e(r.r)}${(r.p||r.e)?`<br>${e([r.p,r.e].filter(Boolean).join(' | '))}`:''}</td></tr>`).join('')}</table>
<h2>Languages</h2><p>${R.langs.map(e).join(', ')}</p>
${DOCS.length?`<h2>Professional Training &amp; Certifications</h2><ul>${DOCS.map(x=>`<li><a class="doclink" href="${e(RESUME_URL)}"><b>${e(x.title)}</b></a>${(x.year||x.org)?` — ${e([x.year,x.org].filter(Boolean).join(', '))}`:''}</li>`).join('')}</ul>`:''}
</body></html>`;
 return new Blob(['\ufeff',h],{type:'application/msword'});
}

/* ================= TEXT ================= */
function buildTxt(){
 const W=80;
 const wrap=(s,w,first='',rest='')=>{const out=[];let line=first,empty=true;A(s).split(/\s+/).forEach(x=>{if(!empty&&(line+' '+x).length>w){out.push(line);line=rest+x}else line+=(empty?'':' ')+x;empty=false});out.push(line);return out.join('\n')};
 const L=[];
 const sec=t=>L.push('','',A(t).toUpperCase(),'-'.repeat(W));
 const ent=(t,dt,o)=>{const l=A(t),r=A(dt);L.push('',l+' '.repeat(Math.max(2,W-l.length-r.length))+r,wrap(o,W))};
 L.push(R.name,A(R.headline),A(R.addr),A(R.email)+' | '+R.phone,'='.repeat(W));
 sec('Professional Summary');L.push(wrap(R.objective,W));
 sec('Key Figures');L.push(R.stats.map(s=>s[1]+': '+s[0]).join('\n'));
 sec('Skills & Tools');R.skills.forEach(([c,i])=>L.push(c+':',wrap(i.join(', '),W,'  ','  ')));
 L.push('Languages: '+R.langs.join(', '));
 sec('Work Experience');R.exp.forEach(x=>{ent(x.t,x.d,x.o);x.b.forEach(b=>L.push(wrap(b,W,'  - ','    ')))});
 sec('Education');R.edu.forEach(x=>{ent(x.t,x.d,x.o)});
 sec('Referees');R.refs.forEach(r=>{L.push('',r.n,wrap(r.r,W));if(r.p||r.e)L.push('  '+[r.p,r.e].filter(Boolean).join(' | '))});
 if(DOCS.length){sec('Professional Training & Certifications');DOCS.forEach(x=>{
   const meta=[x.year,x.org].filter(Boolean).join(' · ');
   L.push('','  - '+x.title+(meta?'  ('+meta+')':''));
   L.push(wrap(RESUME_URL,W,'    ','    '));
 })}
 L.push('');
 return new Blob(['\ufeff'+L.join('\r\n').replace(/\r?\n/g,'\r\n')],{type:'text/plain;charset=utf-8'});
}
</script>
